[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rijndael_alg"
version = "0.1.0"
description = "A from-scratch, educational implementation of AES-128 (Rijndael) in pure Python"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"

[tool.setuptools.packages.find]
include = ["rijndael_alg*"]
